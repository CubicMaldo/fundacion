name: Despliegue Automático a Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build & Deploy a Hostinger public_html
    runs-on: ubuntu-latest
    env:
      HOSTINGER_FTP_SERVER: ${{ secrets.HOSTINGER_FTP_SERVER }}
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v4

      - name: 🟢 Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 📦 Instalar dependencias
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: 🔍 Verificación de tipos TypeScript
        run: npx tsc --noEmit

      - name: 🏗️ Compilar para Hostinger LiteSpeed (Vite + Postbuild)
        run: npm run build

      - name: 🚀 Sincronizar por FTPS a Hostinger public_html
        if: env.HOSTINGER_FTP_SERVER != ''
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.HOSTINGER_FTP_SERVER }}
          username: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./dist/
          server-dir: ./public_html/
          dangerous-clean-slate: false

      - name: ℹ️ Aviso de configuración FTPS
        if: env.HOSTINGER_FTP_SERVER == ''
        run: echo "HOSTINGER_FTP_SERVER no configurado en los secretos de GitHub. Paso de sincronización FTPS omitido."
